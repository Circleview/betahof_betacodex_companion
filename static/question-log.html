<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1c" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Fragen-Log &ndash; BetaCodex Companion</title>
<link rel="stylesheet" href="/style.css">
<!-- Fürs Feedback-Popover im Footer (Backlog #85) - window.onTurnstileLoad
     wird zentral von turnstile.js definiert (importiert über footer.js),
     genau wie auf index.html/import.html. -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit" async defer></script>
</head>
<body>
<a href="#question-log-bereich" class="skip-link" data-i18n="common.skipToContent"></a>
<header id="site-header">
  <span id="lang-switcher" class="lang-switcher"></span>
  <span id="auth-widget" class="auth-widget"></span>
</header>

<section id="question-log-bereich" tabindex="-1">
  <!-- Nutzerwunsch (2026-09-01, Nachtrag): Filter rechtsbündig auf gleicher
       Höhe wie die Überschrift, statt in einer eigenen Zeile darunter -
       alle drei Ereignistypen standardmäßig aktiv, ein Klick blendet den
       jeweiligen Typ ein/aus. Siehe question-log.js für die Filterlogik. -->
  <div id="question-log-header-row" class="question-log-header-row">
    <h2 data-i18n="questionLog.heading"></h2>
    <div id="question-log-filter" class="question-log-filter">
      <button type="button" class="question-log-filter-btn active" data-event-type="first_question">
        <span data-i18n="questionLog.filter.firstQuestion"></span>
      </button>
      <button type="button" class="question-log-filter-btn active" data-event-type="no_answer">
        <span data-i18n="questionLog.filter.noAnswer"></span>
      </button>
      <button type="button" class="question-log-filter-btn active" data-event-type="feedback">
        <span data-i18n="questionLog.filter.feedback"></span>
      </button>
    </div>
  </div>
  <p id="question-log-status" class="changelog-status" data-i18n="questionLog.loading"></p>
  <ul id="question-log-list" class="timeline-mode"></ul>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script type="module" src="/init-header.js"></script>
<script type="module" src="/question-log.js"></script>
<script type="module" src="/init-footer.js"></script>
</body>
</html>
