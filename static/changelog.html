<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1c" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Änderungs-Log &ndash; BetaCodex Companion</title>
<link rel="stylesheet" href="/style.css">
<!-- Fürs Feedback-Popover im Footer (Backlog #85) - window.onTurnstileLoad
     wird zentral von turnstile.js definiert (importiert über footer.js),
     genau wie auf index.html/import.html. -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit" async defer></script>
</head>
<body>
<a href="#changelog-bereich" class="skip-link" data-i18n="common.skipToContent"></a>
<header id="site-header">
  <span id="lang-switcher" class="lang-switcher"></span>
  <span id="auth-widget" class="auth-widget"></span>
</header>

<section id="changelog-bereich" tabindex="-1">
  <h2 data-i18n="changelog.heading"></h2>
  <p id="changelog-status" class="changelog-status" data-i18n="changelog.loading"></p>
  <ul id="changelog-list" class="timeline-mode"></ul>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script type="module" src="/init-header.js"></script>
<script type="module" src="/changelog.js"></script>
<script type="module" src="/init-footer.js"></script>
</body>
</html>
