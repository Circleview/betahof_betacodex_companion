<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>BetaCodex Companion</title>
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="stylesheet" href="/style.css">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit" async defer></script>
</head>
<body>
<section id="frage-bereich" tabindex="-1">
  <aside id="sources-sidebar">
    <h3 data-i18n="index.usedSourcesHeading"></h3>
    <ol id="sidebar-sources-list"></ol>
  </aside>
  <div id="chat-column">
    <div id="chat-messages" aria-live="polite"></div>
    <form id="question-form">
      <textarea id="question" rows="1" data-i18n-placeholder="index.questionPlaceholder" required></textarea>
      <button type="button" id="mic-button" class="mic-button hidden" data-i18n-title="index.micButtonTitle">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>
      <button type="submit" class="send-button" data-i18n-title="index.askButton">
        <svg class="send-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
        <span class="send-label" data-i18n="index.askButton"></span>
      </button>
    </form>
    <!-- Fix (2026-08-30): hierher aus #question-form nachgezogen, analog zu
         index.html (Backlog 2026-08-09) - als Flex-Kind innerhalb des
         Formulars nahm der Container kurz sichtbar Platz in der Eingabezeile
         weg, solange createTurnstileWidget() noch lädt (weder :empty noch
         .turnstile-verified) - das Mikrofon-Icon sprang zur Seite und wieder
         zurück. embed.html war bei diesem Fix bisher nicht mitgezogen worden,
         obwohl beide Seiten dasselbe question.js/dieselbe style.css nutzen -
         WICHTIG: dieser Formular-Ausschnitt sollte mit dem entsprechenden
         Abschnitt in index.html synchron gehalten werden (siehe dortiger
         Kommentar), damit künftige Fixes nicht wieder nur einseitig landen. -->
    <div id="turnstile-container" class="turnstile-container"></div>
  </div>
</section>

<script type="module" src="/question.js"></script>
</body>
</html>
