<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1c" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Nutzerverwaltung &ndash; BetaCodex Chat</title>
<link rel="stylesheet" href="/style.css">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async></script>
</head>
<body>
<a href="#users-bereich" class="skip-link" data-i18n="common.skipToContent"></a>
<header id="site-header">
  <span id="lang-switcher" class="lang-switcher"></span>
  <span id="auth-widget" class="auth-widget"></span>
</header>

<!-- 2026-09-26: Nutzerverwaltung als eigene Seite statt im Login-Popover
     (static/auth.js). Nur für User-Admins, Logik in users.js. -->
<section id="users-bereich" tabindex="-1">
  <h2 data-i18n="users.heading"></h2>
  <p id="users-status" class="web-allowlist-hint" data-i18n="users.loading"></p>

  <div id="users-admin" class="hidden">
    <h3 data-i18n="auth.inviteHeading"></h3>
    <form id="users-invite-form" class="users-invite-form">
      <label><span data-i18n="users.nameLabel"></span>
        <input type="text" id="users-invite-name" autocomplete="off">
      </label>
      <label><span data-i18n="users.emailLabel"></span>
        <input type="email" id="users-invite-email" required autocomplete="off">
      </label>
      <fieldset class="users-invite-roles">
        <legend data-i18n="users.rolesLabel"></legend>
        <div id="users-invite-roles" class="users-role-checkboxes"></div>
      </fieldset>
      <div class="users-invite-actions">
        <button type="submit" data-i18n="auth.inviteSubmit"></button>
        <p id="users-invite-status" class="users-row-status"></p>
      </div>
    </form>

    <h3 data-i18n="users.listHeading"></h3>
    <table class="users-table">
      <thead>
        <tr>
          <th data-i18n="users.colName"></th>
          <th data-i18n="users.colEmail"></th>
          <th data-i18n="users.colStatus"></th>
          <th data-i18n="users.colRoles"></th>
          <th data-i18n="users.colInvited"></th>
          <th data-i18n="users.colLastLogin"></th>
          <th data-i18n="users.colActions"></th>
        </tr>
      </thead>
      <tbody id="users-list"></tbody>
    </table>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script type="module" src="/init-header.js"></script>
<script type="module" src="/users.js"></script>
<script type="module" src="/init-footer.js"></script>
</body>
</html>
