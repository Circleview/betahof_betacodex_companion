<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="Kreativ-Modus des BetaCodex Chat – Blogposts, Artikel und Workshop-Konzepte auf Grundlage des BetaCodex verfassen.">
<meta property="og:title" content="Kreativ-Modus – BetaCodex Chat">
<meta property="og:description" content="Kreativ-Modus des BetaCodex Chat – Blogposts, Artikel und Workshop-Konzepte auf Grundlage des BetaCodex verfassen.">
<meta property="og:type" content="website">
<meta property="og:image" content="/icons/apple-touch-icon.png">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1c" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<title>Kreativ-Modus &ndash; BetaCodex Chat</title>
<link rel="stylesheet" href="/style.css">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async></script>
</head>
<body>
<a href="#creative-bereich" class="skip-link" data-i18n="common.skipToContent"></a>
<header id="site-header">
  <span id="lang-switcher" class="lang-switcher"></span>
  <span id="auth-widget" class="auth-widget"></span>
</header>

<section id="creative-bereich" tabindex="-1">
  <div class="creative-heading-row">
    <h2 data-i18n="creative.heading"></h2>
    <!-- Nutzerwunsch: das Dokument bleibt sonst erhalten (sessionStorage) -
         "neu anfangen" ist der einzige Weg, es bewusst zu verwerfen. -->
    <button type="button" id="creative-new-btn" class="feedback-btn" data-i18n-title="creative.newTextTitle">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><polyline points="3 3 3 9 9 9"></polyline></svg>
      <span class="creative-new-confirm" data-i18n="creative.newTextConfirmButton"></span>
    </button>
  </div>

  <div id="creative-layout">
    <form id="creative-form">
      <div id="creative-toolbar" class="creative-toolbar" role="toolbar">
        <button type="button" data-md-action="bold" data-i18n-title="creative.toolbarBold"><strong>B</strong></button>
        <button type="button" data-md-action="italic" data-i18n-title="creative.toolbarItalic"><em>I</em></button>
        <button type="button" data-md-action="heading" data-i18n-title="creative.toolbarHeading">H</button>
        <button type="button" data-md-action="list" data-i18n-title="creative.toolbarList">&bull;</button>
        <!-- 2026-09-24: Rückgängig/Wiederholen für KI-Änderungen und
             Formatierungen (creative.js: rememberForUndo) - in Vorschau und
             Bearbeiten-Ansicht. -->
        <button type="button" id="creative-undo-btn" data-i18n-title="creative.undoTitle" disabled>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>
        </button>
        <button type="button" id="creative-redo-btn" data-i18n-title="creative.redoTitle" disabled>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 14 20 9 15 4"></polyline><path d="M4 20v-7a4 4 0 0 1 4-4h12"></path></svg>
        </button>
        <button type="button" id="creative-copy-btn" data-i18n-title="creative.copyTitle">
          <svg class="copy-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          <svg class="copy-check" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 12.5 9.5 18 20 6.5"></polyline></svg>
        </button>
        <button type="button" id="creative-preview-toggle"></button>
      </div>
      <!-- Nutzerwunsch (Livegang-Vorbereitung, 2026-09-10): Hinweis bei
           automatischer Sprachumschaltung (siehe creative.js:
           maybeAutoSwitchLang) - bewusst ÜBER der Textbox statt darin, damit
           er nicht mit dem generierten Dokumenttext vermischt wird. Blendet
           sich nach 30s selbst wieder aus (siehe showLangSwitchNotice). -->
      <p id="creative-lang-switch-notice" class="creative-lang-switch-notice hidden" role="status"></p>
      <!-- Nutzerwunsch (2026-08-26): sichtbare "Dokument"-Überschrift entfernt -
           data-i18n-title setzt trotzdem title+aria-label (siehe i18n.js),
           damit das Feld weiterhin einen zugänglichen Namen hat. -->
      <textarea
        id="creative-document"
        rows="16"
        data-i18n-placeholder="creative.documentPlaceholder"
        data-i18n-title="creative.documentLabel"
      ></textarea>
      <div id="creative-document-preview" class="hidden creative-document-preview" aria-live="polite"></div>
      <!-- Daumen-Feedback zum erzeugten Text (siehe answer-feedback.js), gilt für Bearbeiten- UND Vorschau-Ansicht. -->
      <div id="creative-feedback" class="creative-feedback hidden"></div>

      <label for="creative-instruction" class="creative-field-label" data-i18n="creative.instructionLabel"></label>
      <textarea id="creative-instruction" rows="2" data-i18n-placeholder="creative.instructionPlaceholder" required></textarea>

      <!-- Nutzerwunsch (2026-08-30): Mikrofon-Button steht links neben dem
           Absenden-Button, nicht mehr neben der Textarea (siehe
           .creative-submit-row in style.css). Spracheingabe selbst
           unverändert (2026-08-28), inklusive automatischem Absenden nach
           Diktat-Ende (siehe creative.js). -->
      <div class="creative-submit-row">
        <button type="button" id="creative-mic-button" class="mic-button hidden" data-i18n-title="creative.micButtonTitle">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>
        <!-- Nutzerwunsch (2026-08-30): "Wird erzeugt …" erscheint direkt im
             ausgegrauten Button selbst statt in einer separaten Statuszeile
             darunter - bewusst KEIN data-i18n, der Text hängt vom
             Busy-Zustand ab (siehe relabelSubmitButton in creative.js,
             gleiches Muster wie beim previewToggleBtn). -->
        <button type="submit" id="creative-submit"></button>
      </div>
      <div id="turnstile-container" class="turnstile-container"></div>
      <p id="creative-error" class="hidden"></p>
      <p id="creative-disclaimer-mobile" class="creative-disclaimer creative-disclaimer--mobile"></p>
    </form>

    <aside id="creative-sources">
      <p id="creative-disclaimer-desktop" class="creative-disclaimer creative-disclaimer--desktop"></p>
      <h3 data-i18n="creative.sourcesBetacodexHeading"></h3>
      <ul id="creative-sources-betacodex"></ul>
      <h3 data-i18n="creative.sourcesWebHeading"></h3>
      <ul id="creative-sources-web"></ul>
    </aside>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script type="module" src="/init-header.js"></script>
<script type="module" src="/creative.js"></script>
<script type="module" src="/init-footer.js"></script>
</body>
</html>
