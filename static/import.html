<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Backlog #115: siehe Kommentar in index.html -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="Quellenverwaltung für den BetaCodex Companion – Import, Bearbeitung und Pflege der kuratierten Wissensbasis.">
<meta property="og:title" content="Quellen verwalten – BetaCodex Companion">
<meta property="og:description" content="Quellenverwaltung für den BetaCodex Companion – Import, Bearbeitung und Pflege der kuratierten Wissensbasis.">
<meta property="og:type" content="website">
<meta property="og:image" content="/icons/apple-touch-icon.png">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1c" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<title>Quellen verwalten &ndash; BetaCodex Companion</title>
<link rel="stylesheet" href="/style.css">
<!-- Fürs Feedback-Popover im Footer (Backlog #85) - window.onTurnstileLoad
     wird zentral von turnstile.js definiert (importiert über footer.js),
     genau wie auf index.html. -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit" async defer></script>
</head>
<body>
<a href="#quellen-liste-bereich" class="skip-link" data-i18n="common.skipToContent"></a>
<header id="site-header">
  <span id="lang-switcher" class="lang-switcher"></span>
  <span id="auth-widget" class="auth-widget"></span>
</header>

<h2 data-i18n="import.title"></h2>

<datalist id="author-suggestions"></datalist>

<section id="quellen-liste-bereich" tabindex="-1">
  <div class="section-heading-row">
    <h3><span data-i18n="import.importedSourcesHeading"></span> <span id="imported-sources-count"></span></h3>
    <div class="section-heading-actions">
      <div id="quelltyp-bereich" class="quelltyp-buttons">
        <button type="button" id="typ-text" class="circle-button circle-button--sm" data-i18n-title="import.typeTextTitle">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="3" width="16" height="18" rx="1"></rect>
            <line x1="7" y1="8" x2="17" y2="8"></line>
            <line x1="7" y1="12" x2="17" y2="12"></line>
            <line x1="7" y1="16" x2="13" y2="16"></line>
          </svg>
        </button>
        <div class="quelltyp-item--anchor">
          <button type="button" id="typ-url" class="circle-button circle-button--sm" data-i18n-title="import.typeUrlTitle">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="9" width="10" height="6" rx="3"></rect>
              <rect x="11" y="9" width="10" height="6" rx="3"></rect>
              <line x1="9" y1="12" x2="15" y2="12"></line>
            </svg>
          </button>

          <div id="url-popover" class="popover hidden">
            <div class="popover-arrow"></div>
            <button type="button" id="url-popover-close" class="jobs-bar-close accordion-close-btn hidden" data-i18n-title="import.closeButtonTitle">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
            <label><span data-i18n="import.urlPopoverLabel"></span>
              <input type="url" id="popover-url" placeholder="https://...">
            </label>
            <button type="button" id="popover-load" data-i18n="import.loadButton"></button>
            <p id="popover-status"></p>
          </div>
        </div>
        <div class="quelltyp-item--anchor">
          <button type="button" id="typ-file" class="circle-button circle-button--sm" data-i18n-title="import.typeFileTitle">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
          </button>

          <div id="file-popover" class="popover hidden">
            <div class="popover-arrow"></div>
            <button type="button" id="file-popover-close" class="jobs-bar-close accordion-close-btn hidden" data-i18n-title="import.closeButtonTitle">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
            <label><span data-i18n="import.fileFieldLabel"></span>
              <input type="file" id="popover-file" accept="application/pdf,audio/mpeg,audio/wav,audio/x-m4a,audio/mp4,audio/flac,audio/ogg,.mp3,.wav,.m4a,.flac,.ogg,.aac">
            </label>
            <button type="button" id="popover-upload" data-i18n="import.uploadButton"></button>
            <p id="upload-status"></p>
          </div>
        </div>
        <div class="quelltyp-item--anchor">
          <button type="button" id="typ-jobs" class="circle-button circle-button--sm hidden" data-i18n-title="import.jobsIconTitle">
            <svg id="jobs-icon-ring" viewBox="0 0 24 24" width="20" height="20">
              <circle cx="12" cy="12" r="9" fill="none" stroke="var(--color-border)" stroke-width="3"></circle>
              <circle id="jobs-icon-progress" cx="12" cy="12" r="9" fill="none" stroke="var(--color-accent)"
                stroke-width="3" stroke-linecap="round" stroke-dasharray="56.5" stroke-dashoffset="56.5"
                transform="rotate(-90 12 12)"></circle>
            </svg>
            <span id="jobs-icon-count" class="jobs-icon-count hidden"></span>
            <span id="jobs-icon-warning" class="jobs-icon-warning hidden">
              <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3.5 2 20h20L12 3.5z"></path>
                <line x1="12" y1="9.5" x2="12" y2="14"></line>
                <circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"></circle>
              </svg>
            </span>
          </button>

          <div id="jobs-popover" class="popover hidden">
            <div class="popover-arrow"></div>
            <ul id="jobs-list"></ul>
          </div>
        </div>
        <!-- Backlog: LLM/Internet-Fallback bei dünner Quellenlage - Pflege
             der freigegebenen externen Domains/Pfade (nur für Quellen-
             Pfleger:innen/Admins sichtbar, siehe
             updateSourceManagementVisibility). Das Warn-Icon erscheint,
             sobald mindestens ein Eintrag zur Jahresprüfung fällig ist
             (siehe updateWebAllowlistButton). -->
        <button type="button" id="typ-web-allowlist" class="circle-button circle-button--sm" data-i18n-title="import.webAllowlistTitle">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <ellipse cx="12" cy="12" rx="4" ry="9"></ellipse>
            <line x1="3" y1="12" x2="21" y2="12"></line>
          </svg>
          <!-- Nutzerwunsch: Indizierungsstatus als fortlaufender Kreis am
               Globus-Icon, analog zum Fortschrittsring bei #typ-jobs - nur
               sichtbar, solange app/web_crawler.py für mindestens einen
               Eintrag läuft (siehe renderWebAllowlistIcon in import.js). -->
          <svg id="web-allowlist-icon-ring" class="web-allowlist-icon-ring hidden" viewBox="0 0 32 32" width="32" height="32">
            <circle cx="16" cy="16" r="14" fill="none" stroke="var(--color-border)" stroke-width="2"></circle>
            <circle id="web-allowlist-icon-progress" cx="16" cy="16" r="14" fill="none" stroke="var(--color-accent)"
              stroke-width="2" stroke-linecap="round" stroke-dasharray="87.9" stroke-dashoffset="87.9"
              transform="rotate(-90 16 16)"></circle>
          </svg>
          <span id="web-allowlist-warning" class="jobs-icon-warning hidden">
            <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3.5 2 20h20L12 3.5z"></path>
              <line x1="12" y1="9.5" x2="12" y2="14"></line>
              <circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"></circle>
            </svg>
          </span>
        </button>
      </div>
      <div class="sort-toolbar">
        <button type="button" id="sort-author" class="sort-button active" data-i18n-title="import.sortByAuthor">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </button>
        <button type="button" id="sort-date" class="sort-button" data-i18n-title="import.sortByDate">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2h12"></path>
            <path d="M6 22h12"></path>
            <path d="M6 2v5a6 6 0 0 0 6 6 6 6 0 0 0 6-6V2"></path>
            <path d="M6 22v-5a6 6 0 0 1 6-6 6 6 0 0 1 6 6v5"></path>
          </svg>
        </button>
      </div>
      <div class="search-toolbar">
        <button type="button" id="typ-search" class="circle-button circle-button--sm" data-i18n-title="import.searchIconTitle">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
        <!-- Backlog (2026-08-02): Filter auf Quellen mit defektem Link -
             nur für Quellen-Pfleger:innen/System-Admins sichtbar (siehe
             import.js: updateSourceManagementVisibility), Badge zeigt die
             aktuelle Anzahl (updateBrokenLinksButton). -->
        <button type="button" id="typ-broken-links" class="circle-button circle-button--sm hidden" data-i18n-title="import.brokenLinksFilterTitle">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 4l1.5-1.5a3.54 3.54 0 1 1 5 5L19 9"></path>
            <path d="M10 15l-1.5 1.5a3.54 3.54 0 1 1-5-5L5 10"></path>
            <line x1="3" y1="3" x2="21" y2="21"></line>
          </svg>
          <span id="broken-links-count-badge" class="nav-warning-badge hidden"></span>
        </button>
      </div>
      <div id="reindex-bereich" class="hidden">
        <button type="button" id="reindex-sources-btn" class="sort-button" data-i18n-title="import.reindexSourcesTitle">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>
    </div>
    <p id="reindex-status" class="hidden"></p>
  </div>
  <div id="quellen-liste-body" class="quellen-liste-body">
    <div id="author-info-panel" class="author-info-panel hidden"></div>
    <p id="source-filter-status" class="hidden">
      <span id="source-filter-label"></span> <strong id="source-filter-name"></strong>
      &ndash; <button type="button" id="source-filter-clear" class="link-button" data-i18n="import.showAll"></button>
    </p>
    <!-- Backlog (2026-08-04): Ziel-Elternknoten für #url-popover/#file-popover
         auf Mobile - import.js hängt das jeweils geöffnete Popover hier ein,
         damit es als normaler Block im Dokumentfluss den restlichen Inhalt
         akkordeonartig nach unten schiebt statt als Overlay darüber zu
         schweben (siehe .accordion-panel in style.css). Auf Desktop bleibt
         dieser Slot leer, die Popover bleiben dort in ihrer ursprünglichen
         Position innerhalb der Icon-Leiste. -->
    <div id="mobile-import-slot"></div>
    <div id="jobs-bar" class="jobs-bar hidden">
      <button type="button" id="jobs-bar-close" class="jobs-bar-close" data-i18n-title="import.closeButtonTitle">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <ul id="jobs-bar-list"></ul>
    </div>
    <div id="search-bar" class="search-bar hidden">
      <label><span data-i18n="import.searchPopoverLabel"></span>
        <input type="search" id="search-input" data-i18n-placeholder="import.searchPlaceholder">
      </label>
    </div>
    <!-- Nutzerwunsch: Konsistenz mit den übrigen Import-Varianten (URL/Datei/
         Website) - #import-bereich saß ursprünglich als eigene <section> VOR
         der Icon-Leiste/Quellenliste, klappte beim Öffnen also weit oben auf
         der Seite auf statt direkt unter dem geklickten Papier-Icon. Sitzt
         jetzt wie #search-bar/#web-allowlist-bereich hier im Werkzeugleisten-
         Bereich. -->
    <section id="import-bereich" class="hidden">
      <form id="source-form">
        <label><span data-i18n="import.fieldTitle"></span>
          <input type="text" id="title" required>
        </label>
        <div id="create-author-date-row"></div>
        <label><span data-i18n="import.fieldUrl"></span>
          <input type="url" id="url">
        </label>
        <label id="listen-url-label" class="hidden"><span data-i18n="import.fieldListenUrl"></span>
          <input type="url" id="listen-url">
        </label>
        <label id="text-field-label"><span data-i18n="import.fieldText"></span>
          <textarea id="text" rows="10" required></textarea>
        </label>
        <p id="audio-text-pending-hint" class="hidden" data-i18n="import.audioTextPendingHint"></p>
        <p id="pdf-text-pending-hint" class="hidden" data-i18n="import.pdfTextPendingHint"></p>
        <p id="youtube-transcript-fallback-hint" class="hidden"></p>
        <label class="checkbox-label">
          <input type="checkbox" id="restricted">
          <span data-i18n="import.restrictedLabel"></span>
        </label>
        <div class="create-form-actions">
          <button type="submit" id="import-submit-button" data-i18n="import.importButton"></button>
          <button type="button" id="import-cancel-button" class="link-button" data-i18n="common.cancel"></button>
        </div>
      </form>
      <p id="import-status"></p>
    </section>
    <!-- Backlog: LLM/Internet-Fallback bei dünner Quellenlage - Unterbereich
         von "Quellen verwalten", per typ-web-allowlist-Button auf-/zuklappbar.
         Nutzerwunsch: gleiche Position/gleiches Verhalten wie #search-bar
         (klappt direkt hier über der Quellenliste auf, statt weit unten im
         Dokument zu sitzen, wo es bei einer langen Liste ohne Scrollen gar
         nicht sichtbar wäre) - nur für Quellen-Pfleger:innen/Admins sichtbar. -->
    <div id="web-allowlist-bereich" class="web-allowlist-panel hidden">
      <h3 data-i18n="import.webAllowlistHeading"></h3>
      <p class="web-allowlist-hint" data-i18n="import.webAllowlistHint"></p>
      <form id="web-allowlist-form">
        <label><span data-i18n="import.webAllowlistUrlPrefixLabel"></span>
          <input type="url" id="web-allowlist-url-prefix" placeholder="https://beispiel.org/blog" required>
        </label>
        <label><span data-i18n="import.webAllowlistLabelLabel"></span>
          <input type="text" id="web-allowlist-label">
        </label>
        <label><span data-i18n="import.webAllowlistReasonLabel"></span>
          <textarea id="web-allowlist-reason" rows="3" required></textarea>
        </label>
        <label><span data-i18n="import.webAllowlistMaxPagesLabel"></span>
          <input type="number" id="web-allowlist-max-pages" min="1" max="500" value="50">
        </label>
        <button type="submit" data-i18n="import.webAllowlistAddButton"></button>
        <p id="web-allowlist-status"></p>
      </form>
      <ul id="web-allowlist-pending-list" class="web-allowlist-pending-list hidden"></ul>
      <ul id="web-allowlist-list"></ul>
    </div>
    <div id="alphabet-jump-bar" class="alphabet-jump-bar hidden"></div>
    <ul id="source-list"></ul>
  </div>
</section>

<section id="autoren-bereich">
  <h3 data-i18n="import.authorsHeading"></h3>
  <ul id="author-list"></ul>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script type="module" src="/init-header.js"></script>
<script type="module" src="/import.js"></script>
<script type="module" src="/init-footer.js"></script>
</body>
</html>
