<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Backlog #115: vor dem öffentlichen Livegang soll diese Instanz nicht in
     Suchmaschinen/KI-Indizes auftauchen (siehe auch robots.txt und den
     X-Robots-Tag-Header in app/main.py). Vor dem eigentlichen Go-Live
     bewusst wieder entfernen. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="KI-Wissensassistent, der Fragen ausschließlich aus geprüften Beta-Kodex-Quellen beantwortet – mit Quellenverweis.">
<meta property="og:title" content="BetaCodex Companion">
<meta property="og:description" content="KI-Wissensassistent, der Fragen ausschließlich aus geprüften Beta-Kodex-Quellen beantwortet – mit Quellenverweis.">
<meta property="og:type" content="website">
<meta property="og:image" content="/icons/apple-touch-icon.png">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1c" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<title>BetaCodex Companion</title>
<link rel="stylesheet" href="/style.css">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit" async defer></script>
</head>
<body>
<a href="#frage-bereich" class="skip-link" data-i18n="common.skipToContent"></a>
<header id="site-header">
  <span id="lang-switcher" class="lang-switcher"></span>
  <span id="auth-widget" class="auth-widget"></span>
</header>

<section id="frage-bereich" tabindex="-1">
  <aside id="sources-sidebar">
    <h3 data-i18n="index.usedSourcesHeading"></h3>
    <ol id="sidebar-sources-list"></ol>
  </aside>
  <div id="chat-column">
    <div id="chat-messages" aria-live="polite"></div>
    <form id="question-form">
      <textarea id="question" rows="1" data-i18n-placeholder="index.questionPlaceholder" required></textarea>
      <button type="button" id="mic-button" class="mic-button hidden" data-i18n-title="index.micButtonTitle">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>
      <button type="submit" class="send-button" data-i18n-title="index.askButton">
        <svg class="send-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
        <span class="send-label" data-i18n="index.askButton"></span>
      </button>
    </form>
    <!-- Backlog (2026-08-09): NICHT mehr Flex-Item innerhalb von
         #question-form (siehe git-Historie) - solange createTurnstileWidget()
         noch lädt (zwei nacheinander laufende async Schritte, siehe
         turnstile.js), ist der Container kurz weder :empty noch
         .turnstile-verified und nahm dadurch als Flex-Geschwister von
         Mikrofon-/Absenden-Button sichtbar Platz in der Eingabezeile weg -
         das Mikrofon-Icon sprang zur Seite und wieder zurück (gemeldeter
         Bug). Als eigener Block UNTERHALB des Formulars beeinflusst er die
         Eingabezeile gar nicht mehr, sondern schiebt höchstens den
         Fußzeilenbereich etwas nach unten - und das auch nur in dem seltenen
         Fall, dass Cloudflare tatsächlich eine sichtbare Challenge zeigt.
         WICHTIG: static/embed.html baut dieselbe Eingabezeile (#question-
         form + Mikrofon-/Absenden-Button/Turnstile) eigenständig nach (kein
         gemeinsames Template, dieses Projekt hat keinen Build-Schritt) - ein
         Fix an diesem Formular-Ausschnitt sollte dort ebenfalls nachgezogen
         werden (war bei diesem Fix ursprünglich vergessen worden, siehe
         Fix 2026-08-30 in embed.html). -->
    <div id="turnstile-container" class="turnstile-container"></div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script type="module" src="/init-header.js"></script>
<script type="module" src="/question.js"></script>
<script type="module" src="/init-footer.js"></script>
</body>
</html>
