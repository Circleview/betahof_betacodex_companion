<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="KI-Wissensassistent, der Fragen ausschließlich aus geprüften Beta-Kodex-Quellen beantwortet – mit Quellenverweis.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1c" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>BetaCodex Companion</title>
<link rel="stylesheet" href="/style.css">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit" async defer></script>
</head>
<body>
<header>
  <h1><span class="brand-dot" aria-hidden="true"></span><span data-i18n="index.brandName"></span></h1>
  <div class="header-actions">
    <span id="lang-switcher" class="lang-switcher"></span>
    <label class="dev-role-picker desktop-only">
      <span data-i18n="import.testRoleLabel"></span>
      <select id="dev-role"></select>
    </label>
    <a href="/import.html" id="import-link" data-i18n-title="index.viewSources">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16.5a1 1 0 0 1-1 1H6.5A2.5 2.5 0 0 1 4 18V5.5Z"></path>
        <path d="M6.5 3A2.5 2.5 0 0 0 4 5.5V18a2.5 2.5 0 0 0 2.5 2.5H19"></path>
        <line x1="8" y1="7" x2="16" y2="7"></line>
        <line x1="8" y1="11" x2="16" y2="11"></line>
      </svg>
    </a>
  </div>
</header>
<p class="tagline" data-i18n="index.tagline"></p>

<section id="frage-bereich">
  <aside id="sources-sidebar">
    <h3 data-i18n="index.usedSourcesHeading"></h3>
    <ol id="sidebar-sources-list"></ol>
  </aside>
  <div id="chat-column">
    <div id="chat-messages" aria-live="polite"></div>
    <form id="question-form">
      <input type="text" id="question" data-i18n-placeholder="index.questionPlaceholder" required>
      <div id="turnstile-container" class="turnstile-container"></div>
      <button type="submit" class="send-button" data-i18n-title="index.askButton">
        <svg class="send-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
        <span class="send-label" data-i18n="index.askButton"></span>
      </button>
    </form>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script type="module" src="/question.js"></script>
<script type="module">
  import { initFooter } from '/footer.js';
  initFooter();
</script>
</body>
</html>
