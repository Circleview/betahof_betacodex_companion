name: Test & Deploy

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (CPU-only torch, wie auf dem Produktivserver)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: pytest
        run: pytest -q

      - name: node --check (static/*.js)
        run: |
          for f in static/*.js; do
            node --check "$f"
          done

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Blue-Green-Deploy auslösen
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            betacodex@"$DEPLOY_HOST" "~/deploy.sh ${GITHUB_REF_NAME}"
